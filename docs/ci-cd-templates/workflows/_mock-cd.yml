name: Preview Service Deployment
on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      tag_key:
        required: true
        type: string
      sha:
        required: true
        type: string
      compose_file:
        type: string
        default: compose.prod.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Print the commands for the deployment host
        env:
          SERVICE: ${{ inputs.service }}
          TAG_KEY: ${{ inputs.tag_key }}
          RELEASE_SHA: ${{ inputs.sha }}
          COMPOSE_FILE: ${{ inputs.compose_file }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected the commit SHA of the publishing workflow."
            exit 1
          fi
          echo "Mock SSH to the deployment host"
          printf 'Run from the deployment directory after acquiring the host deployment lock:\n'
          printf 'Release: set %s=%s in .env.production, preserving all other tags.\n' "$TAG_KEY" "$RELEASE_SHA"
          printf 'docker compose --env-file .env.production -f %s pull %s\n' "$COMPOSE_FILE" "$SERVICE"
          printf 'docker compose --env-file .env.production -f %s up -d --no-deps --no-build --wait %s\n' "$COMPOSE_FILE" "$SERVICE"
