name: Evaluation CD (Mock)
on:
  workflow_run:
    workflows: ["Evaluation Image CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    uses: ./.github/workflows/_mock-cd.yml
    with:
      service: evaluation-service
      tag_key: EVALUATION_IMAGE_TAG
      sha: ${{ github.event.workflow_run.head_sha }}
