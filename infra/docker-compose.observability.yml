name: domrov-observability
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes: [./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3005:3000"]
    volumes: [./observability/grafana/provisioning:/etc/grafana/provisioning:ro]
    depends_on: [prometheus, loki]
  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/loki-config.yml
    ports: ["3100:3100"]
    volumes: [./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro]
  promtail:
    image: grafana/promtail:3.1.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
