global:
  scrape_interval: 15s
scrape_configs:
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: [auth-service:3001]
  - job_name: academic-service
    metrics_path: /metrics
    static_configs:
      - targets: [academic-service:3002]
  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: [payment-service:3003]
  - job_name: evaluation-service
    metrics_path: /metrics
    static_configs:
      - targets: [evaluation-service:3004]
