apiVersion: apps/v1
kind: Deployment
metadata: {name: ai-api, namespace: domrov}
spec:
  replicas: 2
  selector: {matchLabels: {app: ai-api}}
  template:
    metadata: {labels: {app: ai-api}}
    spec:
      containers:
        - name: ai-api
          image: phyvathanak/domrov-ai-service:dev
          ports: [{name: http, containerPort: 3004}, {name: grpc, containerPort: 50051}]
          envFrom: [{configMapRef: {name: domrov-common}}, {secretRef: {name: domrov-secrets}}]
          env: [{name: PORT, value: "3004"}, {name: GRPC_PORT, value: "50051"}, {name: DATABASE_URL, value: postgresql://domrov:$(AI_DB_PASSWORD)@ai-db:5432/ai_db}]
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: 1, memory: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ai-worker, namespace: domrov}
spec:
  replicas: 1
  selector: {matchLabels: {app: ai-worker}}
  template:
    metadata: {labels: {app: ai-worker}}
    spec:
      containers:
        - name: ai-worker
          image: phyvathanak/domrov-ai-service:dev
          command: ["python", "-m", "app.worker"]
          envFrom: [{configMapRef: {name: domrov-common}}, {secretRef: {name: domrov-secrets}}]
          env: [{name: DATABASE_URL, value: postgresql://domrov:$(AI_DB_PASSWORD)@ai-db:5432/ai_db}]
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: 1, memory: 1Gi}}
