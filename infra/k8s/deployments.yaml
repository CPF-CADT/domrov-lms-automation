apiVersion: apps/v1
kind: Deployment
metadata: {name: auth-service, namespace: domrov}
spec:
  replicas: 2
  selector: {matchLabels: {app: auth-service}}
  template:
    metadata: {labels: {app: auth-service}}
    spec:
      containers:
        - name: auth-service
          image: phyvathanak/domrov-auth-service:dev
          ports: [{name: http, containerPort: 3001}]
          envFrom: [{configMapRef: {name: domrov-common}}, {secretRef: {name: domrov-secrets}}]
          env: [{name: PORT, value: "3001"}, {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: domrov-secrets, key: AUTH_DATABASE_URL}}}]
          readinessProbe: {httpGet: {path: /health/ready, port: http}}
---
