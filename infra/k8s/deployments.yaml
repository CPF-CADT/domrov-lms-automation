apiVersion: apps/v1
kind: Deployment
metadata: {name: auth-service, namespace: domrov}
spec:
  replicas: 2
  selector: {matchLabels: {app: auth-service}}
  template:
    metadata: {labels: {app: auth-service}}
    spec:
      containers:
        - name: auth-service
          image: phyvathanak/domrov-auth-service:dev
          ports: [{name: http, containerPort: 3001}]
          envFrom: [{configMapRef: {name: domrov-common}}, {secretRef: {name: domrov-secrets}}]
          env: [{name: PORT, value: "3001"}, {name: DATABASE_URL, value: postgresql://domrov:$(AUTH_DB_PASSWORD)@auth-db:5432/auth_db}]
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
