apiVersion: v1
kind: ConfigMap
metadata:
  name: domrov-common
  namespace: domrov
data:
  USER_SERVICE_URL: http://user:3001
  ACADEMIC_SERVICE_URL: http://academic-service:3002
  PAYMENT_SERVICE_URL: http://payment-service:3003
  EVALUATION_SERVICE_URL: http://evaluation-service:3004
  RABBITMQ_EVENTS_EXCHANGE: domrov.events
  RABBITMQ_COMMANDS_EXCHANGE: domrov.commands
  RABBITMQ_RETRY_EXCHANGE: domrov.retry
  RABBITMQ_DLX: domrov.dlx
  RABBITMQ_PREFETCH_COUNT: "10"
  RABBITMQ_EVALUATION_QUEUE: domrov.evaluation.events
  RABBITMQ_EVALUATION_WORKER_QUEUE: domrov.evaluation.worker
