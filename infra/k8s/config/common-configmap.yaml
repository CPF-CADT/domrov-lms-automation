apiVersion: v1
kind: ConfigMap
metadata:
  name: domrov-common
  namespace: domrov
data:
  AUTH_SERVICE_URL: http://auth-service:3001
  ACADEMIC_SERVICE_URL: http://academic-service:3002
  PAYMENT_SERVICE_URL: http://payment-service:3003
  AI_SERVICE_URL: http://ai-service:8080
  AI_SERVICE_GRPC_ADDRESS: ai-service:50051
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_EVENTS_EXCHANGE: domrov.events
  RABBITMQ_COMMANDS_EXCHANGE: domrov.commands
  RABBITMQ_RETRY_EXCHANGE: domrov.retry
  RABBITMQ_DLX: domrov.dlx
  RABBITMQ_PREFETCH_COUNT: "10"
  RABBITMQ_ORCHESTRATOR_QUEUE: domrov.ai.orchestrator
