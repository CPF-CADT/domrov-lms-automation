apiVersion: v1
kind: Secret
metadata:
  name: domrov-secrets
  namespace: domrov
type: Opaque
stringData:
  JWT_ACCESS_SECRET: replace-me
  JWT_REFRESH_SECRET: replace-me
  AUTH_DB_PASSWORD: replace-me
  ACADEMIC_DB_PASSWORD: replace-me
  PAYMENT_DB_PASSWORD: replace-me
  AI_DB_PASSWORD: replace-me
  AUTH_DATABASE_URL: postgresql://domrov:replace-me@auth-db:5432/auth_db
  ACADEMIC_DATABASE_URL: postgresql://domrov:replace-me@academic-db:5432/academic_db
  PAYMENT_DATABASE_URL: postgresql://domrov:replace-me@payment-db:5432/payment_db
  AI_DATABASE_URL: postgresql://domrov:replace-me@ai-db:5432/ai_db
  RABBITMQ_URL: amqp://domrov:replace-me@rabbitmq:5672/%2f
  RABBITMQ_PASSWORD: replace-me
