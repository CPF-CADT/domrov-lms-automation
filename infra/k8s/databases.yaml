apiVersion: apps/v1
kind: StatefulSet
metadata: {name: auth-db, namespace: domrov}
spec:
  serviceName: auth-db
  selector: {matchLabels: {app: auth-db}}
  template:
    metadata: {labels: {app: auth-db}}
    spec: {containers: [{name: postgres, image: postgres:16-alpine, ports: [{name: postgres, containerPort: 5432}], env: [{name: POSTGRES_DB, value: auth_db}, {name: POSTGRES_USER, value: domrov}, {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: domrov-secrets, key: AUTH_DB_PASSWORD}}}]}]}
  volumeClaimTemplates: [{metadata: {name: data}, spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}}]
---
