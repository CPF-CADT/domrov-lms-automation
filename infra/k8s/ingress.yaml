apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: domrov
  namespace: domrov
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: api.domrov.local
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend: { service: { name: auth-service, port: { number: 3001 } } }
          - path: /api/users
            pathType: Prefix
            backend: { service: { name: auth-service, port: { number: 3001 } } }
          - path: /api/academic
            pathType: Prefix
            backend: { service: { name: academic-service, port: { number: 3002 } } }
          - path: /api/payment
            pathType: Prefix
            backend: { service: { name: payment-service, port: { number: 3003 } } }
          - path: /api/ai
            pathType: Prefix
            backend: { service: { name: ai-service, port: { number: 3004 } } }
