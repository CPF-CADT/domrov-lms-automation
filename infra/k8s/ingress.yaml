apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: domrov-direct
  namespace: domrov
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: api.domrov.local
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend: {service: {name: auth-service, port: {number: 3001}}}
          - path: /users
            pathType: Prefix
            backend: {service: {name: auth-service, port: {number: 3001}}}
          - path: /wallet
            pathType: Prefix
            backend: {service: {name: payment-service, port: {number: 3003}}}
          - path: /payment
            pathType: Prefix
            backend: {service: {name: payment-service, port: {number: 3003}}}
          - path: /evaluations
            pathType: Prefix
            backend: {service: {name: ai-service, port: {number: 8080}}}
          - path: /api/auth
            pathType: Prefix
            backend: {service: {name: auth-service, port: {number: 3001}}}
          - path: /api/users
            pathType: Prefix
            backend: {service: {name: auth-service, port: {number: 3001}}}
          - path: /api/academic
            pathType: Prefix
            backend: {service: {name: academic-service, port: {number: 3002}}}
          - path: /api/payment
            pathType: Prefix
            backend: {service: {name: payment-service, port: {number: 3003}}}
          - path: /api/ai
            pathType: Prefix
            backend: {service: {name: ai-service, port: {number: 8080}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: domrov-academic-legacy
  namespace: domrov
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /api/academic/$1/$3
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: api.domrov.local
      http:
        paths:
          - path: /(class|team|assessments|submissions|file)(/|$)(.*)
            pathType: ImplementationSpecific
            backend: {service: {name: academic-service, port: {number: 3002}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: domrov-legacy
  namespace: domrov
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: api.domrov.local
      http:
        paths:
          - path: /notifications
            pathType: Prefix
            backend: {service: {name: legacy-backend, port: {number: 3000}}}
          - path: /admin
            pathType: Prefix
            backend: {service: {name: legacy-backend, port: {number: 3000}}}
