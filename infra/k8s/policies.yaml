apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: auth-service, namespace: domrov}
spec: {minAvailable: 1, selector: {matchLabels: {app: auth-service}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: academic-service, namespace: domrov}
spec: {minAvailable: 1, selector: {matchLabels: {app: academic-service}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: payment-service, namespace: domrov}
spec: {minAvailable: 1, selector: {matchLabels: {app: payment-service}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: ai-api, namespace: domrov}
spec: {minAvailable: 1, selector: {matchLabels: {app: ai-api}}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: domrov}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-service-traffic, namespace: domrov}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: [{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: domrov}}}]}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: domrov}}}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
