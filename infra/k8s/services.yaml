apiVersion: v1
kind: Service
metadata: {name: auth-service, namespace: domrov}
spec:
  selector: {app: auth-service}
  ports: [{name: http, port: 3001, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: academic-service, namespace: domrov}
spec:
  selector: {app: academic-service}
  ports: [{name: http, port: 3002, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: payment-service, namespace: domrov}
spec:
  selector: {app: payment-service}
