name: Frontend CI

on:
  push:
    paths:
      - 'apps/react-client/**'
      - 'apps/admin/**'
      - '.github/workflows/frontend-ci.yml'

  pull_request:
    paths:
      - 'apps/react-client/**'
      - 'apps/admin/**'
      - '.github/workflows/frontend-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  student:
    name: Student Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/react-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/react-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build frontend
        run: npm run build

  admin:
    name: Admin Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build frontend
        run: npm run build
