name: Verify Demo Deployment

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      sha:
        required: true
        type: string
      image:
        type: string
      artifact:
        type: string
      run_id:
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: false

permissions:
  actions: read
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sign in to Docker Hub
        if: inputs.image != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Download the frontend build from CI
        if: inputs.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}-${{ inputs.sha }}
          path: frontend-build
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Start, verify, and remove demo deployment
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          RELEASE_SHA: ${{ inputs.sha }}
          IMAGE: ${{ inputs.image }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$IMAGE" ]]; then
            : "${DOCKER_USERNAME:?Set the same Docker Hub username as CI}"
            export DEMO_IMAGE="docker.io/$DOCKER_USERNAME/$IMAGE:$RELEASE_SHA"
          fi
          bash infra/deploy/demo.sh "$TARGET" "$PWD/frontend-build"
