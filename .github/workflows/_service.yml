name: Service checks

on:
  workflow_call:
    inputs:
      service:
        description: Service name
        required: true
        type: string
      path:
        description: Service directory
        required: true
        type: string
      runtime:
        description: Service runtime (node or go)
        required: true
        type: string
      image:
        description: Docker image name
        required: true
        type: string
      context:
        description: Docker build context
        required: true
        type: string
      compose_service:
        description: Compose service to smoke test
        required: true
        type: string
      image_env:
        description: Compose image variable (empty for code-execution's fixed image)
        type: string
        default: ''
      scan_blocking:
        description: Fail the build on fixable high or critical vulnerabilities
        type: boolean
        default: false
      tests_blocking:
        description: Fail the job when tests fail
        type: boolean
        default: true
      lint:
        description: Run Node.js lint checks
        type: boolean
        default: false
      publish:
        description: Publish image to Docker Hub
        type: boolean
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        description: Docker Hub login token
        required: false

permissions:
  contents: read

jobs:
  test:
    name: test (${{ inputs.service }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: inputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ inputs.path }}/package-lock.json

      - name: Install Node.js dependencies
        if: inputs.runtime == 'node'
        run: npm ci

      - name: Lint Node.js service
        if: inputs.runtime == 'node' && inputs.lint
        run: npm run lint

      - name: Test Node.js service
        if: inputs.runtime == 'node'
        continue-on-error: ${{ !inputs.tests_blocking }}
        run: npm test -- --runInBand

      - name: Build Node.js service
        if: inputs.runtime == 'node'
        run: npm run build

      - name: Set up Go
        if: inputs.runtime == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.path }}/go.mod
          cache: true
          cache-dependency-path: ${{ inputs.path }}/go.sum

      - name: Check Go formatting
        if: inputs.runtime == 'go'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet Go service
        if: inputs.runtime == 'go'
        run: go vet ./...

      - name: Test Go service
        if: inputs.runtime == 'go'
        continue-on-error: ${{ !inputs.tests_blocking }}
        run: go test ./...

      - name: Build Go service
        if: inputs.runtime == 'go'
        run: go build -o /tmp/out ./cmd/server

  build:
    name: build (${{ inputs.service }})
    needs: test
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: ci-${{ inputs.service }}-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_SERVICE: ${{ inputs.compose_service }}
      LOCAL_IMAGE: ci-local/${{ inputs.image }}:ci
      IMAGE_ENV: ${{ inputs.image_env }}
      BACKEND_ENV_FILE: /dev/null
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
      SERVICE_AUTH_TOKEN: ci-only-service-token-not-for-production
      EBS_MOUNT_PATH: /tmp/ci-${{ inputs.service }}-${{ github.run_id }}-${{ github.run_attempt }}/files
      CODE_EXECUTION_WORKSPACE_DIR: /tmp/ci-${{ inputs.service }}-${{ github.run_id }}-${{ github.run_attempt }}/execution
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_USERNAME || 'domrov' }}/${{ inputs.image }}
          flavor: latest=false
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: false
          load: true
          tags: ci-local/${{ inputs.image }}:ci
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,scope=${{ inputs.service }},mode=max

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ci-local/${{ inputs.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          format: table
          exit-code: ${{ inputs.scan_blocking && '1' || '0' }}

      - name: Configure Compose image
        run: |
          if [ "$COMPOSE_SERVICE" = "code-execution" ]; then
            docker tag "$LOCAL_IMAGE" domrov-code-execution:dev
          else
            case "$IMAGE_ENV" in
              USER_IMAGE|ACADEMIC_SERVICE_IMAGE|PAYMENT_SERVICE_IMAGE|EVALUATION_SERVICE_IMAGE)
                printf '%s=%s\n' "$IMAGE_ENV" "$LOCAL_IMAGE" >> "$GITHUB_ENV"
                ;;
              *)
                printf 'Unsupported Compose image variable: %s\n' "$IMAGE_ENV"
                exit 1
                ;;
            esac
          fi

      - name: Smoke test Compose service
        timeout-minutes: 6
        run: docker compose --env-file /dev/null -f docker-compose.yml up -d --wait --wait-timeout 300 --no-build "$COMPOSE_SERVICE"

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose --env-file /dev/null -f docker-compose.yml logs "$COMPOSE_SERVICE"

      - name: Clean up Compose services
        if: always()
        run: docker compose --env-file /dev/null -f docker-compose.yml down -v

  publish:
    name: publish (${{ inputs.service }})
    needs: build
    if: inputs.publish && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Docker Hub configuration
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "Missing DOCKER_USERNAME repository variable"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing DOCKERHUB_TOKEN repository secret"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_USERNAME }}/${{ inputs.image }}
          flavor: latest=false
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable={{is_default_branch}}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,scope=${{ inputs.service }},mode=max
