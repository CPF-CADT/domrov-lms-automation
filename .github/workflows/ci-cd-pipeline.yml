name: CI/CD Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
############################################################
# DETECT CHANGES
############################################################
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      nestjs: ${{ steps.filter.outputs.nestjs }}
      python: ${{ steps.filter.outputs.python }}
      admin: ${{ steps.filter.outputs.admin }}
      client: ${{ steps.filter.outputs.client }}

    steps:
      - uses: actions/checkout@v3

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nestjs:
              - 'apps/backend_nest/**'

            python:
              - 'apps/code_eval/**'

            admin:
              - 'apps/admin/**'

            client:
              - 'apps/react-client/**'

############################################################
# TEST NESTJS
############################################################
  test-nestjs:
    needs: detect-changes
    if: needs.detect-changes.outputs.nestjs == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./apps/backend_nest
        run: npm ci

      - name: Run Tests
        working-directory: ./apps/backend_nest
        run: npm run test:ci

############################################################
# BUILD & PUSH DOCKER IMAGES
############################################################
  build-and-push:
    needs: [detect-changes, test-nestjs]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v2

      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Backend
      - name: Build & Push Backend
        if: needs.detect-changes.outputs.nestjs == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend_nest
          push: true
          tags: |
            phyvathanak/nestjs-backend:latest
            phyvathanak/nestjs-backend:${{ github.sha }}

      # Python
      - name: Build & Push Code Eval
        if: needs.detect-changes.outputs.python == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/code_eval
          push: true
          tags: |
            phyvathanak/code_eval:latest
            phyvathanak/code_eval:${{ github.sha }}

############################################################
# DEPLOY VIA DOCKER COMPOSE (ONE EC2)
############################################################
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 (Compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu

            # Pull latest images
            docker pull phyvathanak/nestjs-backend:latest
            docker pull phyvathanak/code_eval:latest

            # Restart services
            docker compose down
            docker compose up -d

            # Cleanup
            docker image prune -af

############################################################
# ADMIN FRONTEND 
############################################################
  deploy-admin:
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - run: npm ci
        working-directory: ./apps/admin

      - run: npm run build
        working-directory: ./apps/admin
        env:
          VITE_API_URL: https://api.domrov.app

      - uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET_ADMIN }}
          SOURCE_DIR: ./apps/admin/dist

############################################################
# CLIENT FRONTEND 
############################################################
  deploy-client:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - run: npm ci
        working-directory: ./apps/react-client

      - run: npm run build
        working-directory: ./apps/react-client
        env:
          VITE_API_URL: https://api.domrov.app

      - uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET_CLIENT }}
          SOURCE_DIR: ./apps/react-client/dist