name: Deploy Frontends

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
############################################################
# DETECT CHANGES
############################################################
  detect-changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      client: ${{ steps.filter.outputs.client }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            admin:
              - 'apps/admin/**'

            client:
              - 'apps/react-client/**'

############################################################
# ADMIN FRONTEND
############################################################
  deploy-admin:
    needs: detect-changes
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.admin == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
        working-directory: ./apps/admin

      - run: npm run build
        working-directory: ./apps/admin
        env:
          VITE_API_URL: https://api.domrov.app

      - uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET_ADMIN }}
          SOURCE_DIR: ./apps/admin/dist

############################################################
# CLIENT FRONTEND
############################################################
  deploy-client:
    needs: detect-changes
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.client == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
        working-directory: ./apps/react-client

      - run: npm run build
        working-directory: ./apps/react-client
        env:
          VITE_API_URL: https://api.domrov.app

      - uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET_CLIENT }}
          SOURCE_DIR: ./apps/react-client/dist
