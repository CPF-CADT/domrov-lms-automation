name: Academic Service CI

on:
  pull_request:
    paths:
      - apps/backend/academic/**
      - .github/workflows/academic-service.yml
      - .github/workflows/_service.yml
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - apps/backend/academic/**
      - .github/workflows/academic-service.yml
      - .github/workflows/_service.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish image to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/_service.yml
    secrets: inherit
    with:
      service: academic
      path: apps/backend/academic
      runtime: node
      image: domrov-academic-service
      context: apps/backend/academic
      lint: false
      # TEMPORARY: tests are failing on main, owner Rathanak; set back to true when fixed
      tests_blocking: false
      publish: >-
        ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) ||
            github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
