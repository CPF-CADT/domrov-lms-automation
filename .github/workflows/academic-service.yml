name: academic-service
on:
  push:
    paths: ["apps/backend/academic/**", "contracts/academic/**", ".github/workflows/academic-service.yml"]
  pull_request:
    paths: ["apps/backend/academic/**", "contracts/academic/**", ".github/workflows/academic-service.yml"]
  workflow_dispatch:
jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate service scaffold
        run: |
          if [ ! -d apps/backend/academic ]; then echo "Academic Service not extracted yet; scaffold validation skipped."; exit 0; fi
          cd apps/backend/academic
          if [ -f package.json ]; then npm ci; npm run lint --if-present; npm test --if-present -- --runInBand; npm run build --if-present; fi
          test -f Dockerfile
          docker build --tag domrov/academic-service:${GITHUB_SHA} .
