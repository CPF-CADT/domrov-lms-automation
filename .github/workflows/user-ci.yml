name: User Image CI
on:
  pull_request:
    paths:
      - 'apps/backend/user/**'
      - '.github/workflows/user-ci.yml'
      - '.github/workflows/_image-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/user/**'
      - '.github/workflows/user-ci.yml'
      - '.github/workflows/_image-ci.yml'

jobs:
  image:
    uses: ./.github/workflows/_image-ci.yml
    with:
      context: apps/backend/user
      image: domrov-user
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
