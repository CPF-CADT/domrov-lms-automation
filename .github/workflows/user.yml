name: User Service CI

on:
  pull_request:
    paths:
      - apps/backend/user/**
      - .github/workflows/user.yml
      - .github/workflows/_service.yml
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - apps/backend/user/**
      - .github/workflows/user.yml
      - .github/workflows/_service.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish image to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/_service.yml
    secrets: inherit
    with:
      service: user
      path: apps/backend/user
      runtime: node
      image: domrov-user
      context: apps/backend/user
      compose_service: user
      image_env: USER_IMAGE
      lint: false
      # TEMPORARY: tests are failing on main, owner Rathanak; set back to true when fixed
      tests_blocking: false
      publish: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
