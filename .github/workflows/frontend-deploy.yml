name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'apps/react-client/**'
      - '.github/workflows/frontend-deploy.yml'

  workflow_dispatch:
    inputs:
      target:
        description: Frontend to deploy
        type: choice
        options:
          - both
          - admin
          - client
        default: both
        required: true

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin || steps.manual.outputs.admin }}
      client: ${{ steps.filter.outputs.client || steps.manual.outputs.client }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            admin:
              - 'apps/admin/**'
            client:
              - 'apps/react-client/**'

      - name: Manual deployment selection
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET: ${{ inputs.target }}
        run: |
          echo "admin=$([[ "$TARGET" == "both" || "$TARGET" == "admin" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "client=$([[ "$TARGET" == "both" || "$TARGET" == "client" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy-admin:
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        working-directory: apps/admin
        run: npm ci

      - name: Build Admin
        working-directory: apps/admin
        run: npm run build
        env:
          VITE_API_URL: https://api.domrov.app

      - name: Deploy Admin to S3
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET_ADMIN }}
          SOURCE_DIR: apps/admin/dist

  deploy-client:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/react-client/package-lock.json

      - name: Install dependencies
        working-directory: apps/react-client
        run: npm ci

      - name: Build Client
        working-directory: apps/react-client
        run: npm run build
        env:
          VITE_API_URL: https://api.domrov.app

      - name: Deploy Client to S3
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET_CLIENT }}
          SOURCE_DIR: apps/react-client/dist
