name: Evaluation Service CI

on:
  pull_request:
    paths:
      - apps/backend/evaluation/**
      - .github/workflows/evaluation-service.yml
      - .github/workflows/_service.yml
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - apps/backend/evaluation/**
      - .github/workflows/evaluation-service.yml
      - .github/workflows/_service.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish image to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/_service.yml
    secrets: inherit
    with:
      service: evaluation
      path: apps/backend/evaluation
      runtime: node
      image: domrov-evaluation-service
      context: apps/backend/evaluation
      compose_service: evaluation-service
      image_env: EVALUATION_SERVICE_IMAGE
      lint: false
      tests_blocking: true
      publish: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
