global:
  scrape_interval: 15s
  scrape_timeout: 8s
  evaluation_interval: 15s
rule_files: [rules.yml]
scrape_configs:
  - job_name: observability
    static_configs:
      - targets: [prometheus:9090, alloy:12345, loki:3100, tempo:3200, otel-collector:8888, blackbox-exporter:9115]
  - job_name: domrov-otel
    static_configs:
      - targets: [otel-collector:9464]
  - job_name: domrov-host
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: cadvisor
    file_sd_configs:
      - files: [/etc/cadvisor-targets.yml]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_network_(receive|transmit)_bytes_total'
        action: keep
      - source_labels: [container_label_com_docker_compose_project]
        target_label: compose_project
        action: keepequal
      - source_labels: [container_label_com_docker_compose_service]
        regex: '.+'
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        target_label: compose_service
      - regex: 'container_label_com_docker_compose_(project|service)'
        action: labeldrop
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
  - job_name: domrov-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://gateway/health"]
        labels: {service: gateway}
      - targets: ["http://user:3001/health/ready"]
        labels: {service: user}
      - targets: ["http://academic-service:3002/api/academic/health/ready"]
        labels: {service: academic-service}
      - targets: ["http://payment-service:3003/health/ready"]
        labels: {service: payment-service}
      - targets: ["http://evaluation-service:3004/health/ready"]
        labels: {service: evaluation-service}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [service], target_label: instance}
      - {target_label: __address__, replacement: "blackbox-exporter:9115"}
  - job_name: domrov-postgres
    static_configs:
      - targets: [postgres-exporter:9187]
