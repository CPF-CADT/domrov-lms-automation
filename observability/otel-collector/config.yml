extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 224
    spike_limit_mib: 48
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - keep_keys(resource.attributes, ["service.name"])
      - keep_keys(scope.attributes, [])
      - keep_keys(span.attributes, ["http.request.method", "http.route", "http.response.status_code", "messaging.system", "messaging.destination.name", "messaging.operation.name", "messaging.operation.type", "messaging.rabbitmq.destination.routing_key", "error.type", "outcome"])
      - set(span.status.message, "")
      - set(span.trace_state, "")
      - keep_keys(spanevent.attributes, [])
      - set(spanevent.name, "event")
    metric_statements:
      - keep_keys(resource.attributes, ["service.name"])
      - keep_keys(scope.attributes, [])
      - keep_keys(datapoint.attributes, ["http.request.method", "http.route", "http.response.status_code", "messaging.system", "messaging.destination.name", "messaging.operation.name", "messaging.operation.type", "messaging.rabbitmq.destination.routing_key", "error.type", "outcome"])
  batch:
    timeout: 2s
    send_batch_size: 128
    send_batch_max_size: 256

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 128
      num_consumers: 2
  prometheus:
    endpoint: 0.0.0.0:9464
    enable_open_metrics: true
    resource_constant_labels:
      included: ["service.name"]

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [prometheus]
