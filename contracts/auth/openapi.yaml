openapi: 3.0.3
info:
  title: DOMROV Auth Service API
  version: 1.0.0
  description: Identity, authentication, roles, OAuth, and user profiles.
servers:
  - url: /api/auth
tags:
  - name: authentication
  - name: users
paths:
  /sign-up:
    post:
      tags: [authentication]
      summary: Legacy registration route retained for the existing frontend
      operationId: legacySignUp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: User registered in the legacy success/data envelope }
        '409': { $ref: '#/components/responses/Conflict' }
  /register:
    post:
      tags: [authentication]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Conflict' }
  /login:
    post:
      tags: [authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /refresh:
    post:
      tags: [authentication]
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Access token refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /refresh-token:
    post:
      tags: [authentication]
      summary: Legacy cookie-based refresh route retained for the existing frontend
      operationId: legacyRefresh
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          schema: { type: string }
      responses:
        '200': { description: Access token refreshed in the legacy success/data envelope }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /logout:
    post:
      tags: [authentication]
      security: [{ bearerAuth: [] }]
      operationId: logout
      parameters:
        - name: X-Refresh-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /verify-email:
    post:
      tags: [authentication]
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '200':
          description: Email verified and tokens issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /request-password-reset:
    post:
      tags: [authentication]
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '200': { description: Reset request accepted }
  /resend-verification:
    post:
      tags: [authentication]
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '200': { description: Verification code sent in the legacy success/data envelope }
  /reset-password:
    post:
      tags: [authentication]
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { description: Password reset completed }
        '400': { $ref: '#/components/responses/BadRequest' }
  /users/me:
    get:
      tags: [users]
      security: [{ bearerAuth: [] }]
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [users]
      security: [{ bearerAuth: [] }]
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/change-password:
    post:
      tags: [users]
      security: [{ bearerAuth: [] }]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { description: Password changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /health/live:
    get:
      operationId: liveness
      responses: { '200': { description: Process is alive } }
  /health/ready:
    get:
      operationId: readiness
      responses: { '200': { description: Ready }, '503': { description: Not ready } }
  /metrics:
    get:
      operationId: metrics
      responses: { '200': { description: Prometheus metrics } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1 }
    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, format: int32, minimum: 1 }
    User:
      type: object
      required: [id, email, firstName, lastName, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string, enum: [student, teacher, admin] }
    UpdateUserRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8 }
        confirmPassword: { type: string }
    VerifyEmailRequest:
      type: object
      required: [email, otp]
      properties:
        email: { type: string, format: email }
        otp: { type: string, pattern: '^\\d{6}$' }
    ResetPasswordRequest:
      type: object
      required: [email, otp, newPassword]
      properties:
        email: { type: string, format: email }
        otp: { type: string, pattern: '^\\d{6}$' }
        newPassword: { type: string, minLength: 8 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: array, items: {} }
  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
