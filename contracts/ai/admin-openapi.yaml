openapi: 3.0.3
info:
  title: DOMROV AI Evaluation Admin API
  version: 1.0.0
  description: Service-owned evaluation inspection, usage, and lifecycle logs.
servers:
  - url: /
paths:
  /admin/evaluations:
    get:
      security: [{ adminToken: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200': { description: Evaluation records owned by ai_db }
        '403': { description: Invalid or missing admin token }
  /admin/evaluations/{evaluationId}:
    get:
      security: [{ adminToken: [] }]
      parameters:
        - { name: evaluationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Evaluation record }
        '403': { description: Invalid or missing admin token }
        '404': { description: Evaluation not found }
  /admin/usage:
    get:
      security: [{ adminToken: [] }]
      responses:
        '200': { description: Aggregated AI usage from ai_db }
        '403': { description: Invalid or missing admin token }
  /admin/logs:
    get:
      security: [{ adminToken: [] }]
      parameters:
        - { name: evaluation_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200': { description: Evaluation lifecycle logs from ai_db }
        '403': { description: Invalid or missing admin token }
components:
  securitySchemes:
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
