openapi: 3.0.3
info:
  title: DOMROV Academic Service API
  version: 1.0.0
  description: Classes, teams, assignments, rubrics, submissions, and academic results.
servers:
  - url: /api/academic
paths:
  /classes:
    post:
      operationId: createClass
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClassRequest' }
      responses:
        '201':
          description: Class created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Class' }
    get:
      operationId: listClasses
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Classes visible to the caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Class' }
  /classes/{classId}/enrollments:
    post:
      operationId: enrollInClass
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '201':
          description: Enrollment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
  /assignments:
    post:
      operationId: createAssignment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssignmentRequest' }
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
  /assignments/{assignmentId}/submissions:
    post:
      operationId: createSubmission
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubmissionRequest' }
      responses:
        '202':
          description: Submission stored and evaluation queued when enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
  /submissions/{submissionId}:
    get:
      operationId: getSubmission
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Submission and evaluation state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
  /health/live:
    get:
      operationId: liveness
      responses: { '200': { description: Process is alive } }
  /health/ready:
    get:
      operationId: readiness
      responses: { '200': { description: Ready }, '503': { description: Not ready } }
  /metrics:
    get:
      operationId: metrics
      responses: { '200': { description: Prometheus metrics } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ClassId: { name: classId, in: path, required: true, schema: { type: string, format: uuid } }
    AssignmentId: { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    SubmissionId: { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    CreateClassRequest:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1 }, description: { type: string } }
    Class:
      type: object
      required: [id, name, ownerId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        ownerId: { type: string, format: uuid, description: External Auth user ID }
    Enrollment:
      type: object
      required: [classId, userId, status]
      properties:
        classId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        status: { type: string, enum: [active, removed] }
    CreateAssignmentRequest:
      type: object
      required: [classId, title, instruction, maxScore]
      properties:
        classId: { type: string, format: uuid }
        title: { type: string }
        instruction: { type: string }
        maxScore: { type: number, minimum: 0 }
        aiEvaluationEnabled: { type: boolean, default: false }
        dueAt: { type: string, format: date-time }
    Assignment:
      allOf:
        - $ref: '#/components/schemas/CreateAssignmentRequest'
        - type: object
          required: [id]
          properties: { id: { type: string, format: uuid } }
    CreateSubmissionRequest:
      type: object
      required: [resourceId]
      properties:
        resourceId: { type: string, format: uuid }
        language: { type: string, example: python }
    SubmissionAccepted:
      type: object
      required: [submissionId, status]
      properties:
        submissionId: { type: string, format: uuid }
        evaluationId: { type: string, format: uuid }
        status: { type: string, enum: [stored, queued, pending] }
    Submission:
      allOf:
        - $ref: '#/components/schemas/SubmissionAccepted'
        - type: object
          properties:
            score: { type: number, nullable: true }
            feedback: { type: string, nullable: true }
