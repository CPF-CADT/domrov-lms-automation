services:
  backend:
    build:
      context: ./apps/backend_nest
      dockerfile: Dockerfile
    container_name: domrov_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./apps/backend_nest/.env
    environment:
      CODE_EVAL_GRPC_CLIENT_HOST: code_eval
      CODE_EVAL_GRPC_CLIENT_PORT: 50051
      REDIS_URL: redis://redis:6379/0
      LOCAL_FILE_ROOT: /data/files
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-262144000}
      MAX_STORAGE_QUOTA_BYTES: ${MAX_STORAGE_QUOTA_BYTES:-0}
      MIN_FREE_SPACE_BYTES: ${MIN_FREE_SPACE_BYTES:-1073741824}
    volumes:
      - ${EBS_MOUNT_PATH:-./.local-ebs/files}:/data/files
    depends_on:
      code_eval:
        condition: service_started
      redis:
        condition: service_started

  client:
    build:
      context: ./apps/react-client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: domrov_client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started

  code_eval:
    build:
      context: ./apps/code_eval
      dockerfile: Dockerfile
    container_name: domrov_code_eval
    restart: unless-stopped
    env_file:
      - ./apps/code_eval/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      LOCAL_FILE_ROOT: /data/files
      EVAL_MAX_ARCHIVE_FILES: ${EVAL_MAX_ARCHIVE_FILES:-10000}
      EVAL_MAX_EXTRACTED_SIZE: ${EVAL_MAX_EXTRACTED_SIZE:-536870912}
      EVALUATION_CACHE_TTL_SECONDS: ${EVALUATION_CACHE_TTL_SECONDS:-86400}
      EVALUATION_CACHE_CLEANUP_INTERVAL_SECONDS: ${EVALUATION_CACHE_CLEANUP_INTERVAL_SECONDS:-3600}
    volumes:
      - ${EBS_MOUNT_PATH:-./.local-ebs/files}:/data/files
    expose:
      - "50051"
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: domrov_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    expose:
      - "6379"

volumes:
  redis_data:

networks:
  default:
    name: domrov_network
