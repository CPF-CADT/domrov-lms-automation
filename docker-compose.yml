name: domrov

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev}
      POSTGRES_DB: ${DB_NAME:-domrov}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dev} -d ${DB_NAME:-domrov}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend_nest:
    build:
      context: ./apps/backend_nest
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    command: npm run start:dev
    env_file:
      - ./apps/backend_nest/.env
    environment:
      TZ: Asia/Phnom_Penh
      POSTGRES_URL: postgresql://${DB_USER:-dev}:${DB_PASSWORD:-dev}@postgres:5432/${DB_NAME:-domrov}
      REDIS_URL: redis://redis:6379/0
      CODE_EVAL_GRPC_CLIENT_HOST: code_eval
      CODE_EVAL_GRPC_CLIENT_PORT: 50051
      BASE_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - ./apps/backend_nest:/app
      - ./apps/shared:/app/shared
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  code_eval:
    build:
      context: ./apps/code_eval
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    command: python main.py
    env_file:
      - ./apps/code_eval/.env
    environment:
      TZ: Asia/Phnom_Penh
      REDIS_URL: redis://redis:6379/0
      CODE_EVAL_GRPC_HOST: backend_nest
      CODE_EVAL_GRPC_PORT: 50052
    ports:
      - "50051:50051"
    volumes:
      - ./apps/code_eval:/app
      - ./apps/shared:/app/shared
      - files_cache_data:/files_cache
    depends_on:
      redis:
        condition: service_healthy
      backend_nest:
        condition: service_started

  react-client:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/react-client:/app
      - react_client_node_modules:/app/node_modules
    depends_on:
      backend_nest:
        condition: service_started

  admin:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5174:5174"
    volumes:
      - ./apps/admin:/app
      - admin_node_modules:/app/node_modules
    depends_on:
      backend_nest:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  files_cache_data:
  react_client_node_modules:
  admin_node_modules:
